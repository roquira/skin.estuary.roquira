name: Check

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check XML and Python
        run: python3 .github/scripts/check.py

      - name: Build add-on zip
        run: .github/scripts/build-zip.sh dist

      - name: Upload add-on zip
        uses: actions/upload-artifact@v7
        with:
          name: skin.estuary.roquira-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
